version: '3.8'

services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: meander-osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/tatarstan-latest.osrm

  postgres:
    image: postgis/postgis:15-3.3
    container_name: meander-postgres
    environment:
      POSTGRES_USER: meander
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: meander_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres-data:
